  root-url: file:/Volumes/SanDisk_Mac/WorkPlace/GITHUB_WORKPLACE/Web-Sharing-QR-For-Routes/backend/QRForRoutes/resource
  avatar-dir: avatar
  avatar-default: default.jpg
  qr-dir: qr
