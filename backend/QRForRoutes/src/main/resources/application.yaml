# ================== MyBatis-Plus ==================
mybatis-plus:
  # mapper XML 放的位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包名
  type-aliases-package: com.liu.qrRoutes.model

  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 是否开启二级缓存
    cache-enabled: false
    # 控制台打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      # 主键策略（AUTO=数据库自增）
      id-type: auto

# ================== Logback ==================
logging:
  level:
    root: info
    # 全局项目包的日志级别
    com.liu: debug
    # MyBatis-Plus 相关日志
    com.baomidou.mybatisplus: debug
  # 日志文件输出配置（简单版）
  file:
    name: logs/qrRoutes.log
  # 控制台日志格式
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# ================== 静态资源 ==================
